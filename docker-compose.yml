version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: staynest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: staynest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/staynest_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staynest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staynest-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/staynest_db
      SECRET_KEY: staynest-docker-secret-jwt-key-2026
      ENVIRONMENT: production
      DEBUG: "False"
      RAZORPAY_KEY_ID: rzp_test_staynest_sample_key
      RAZORPAY_KEY_SECRET: staynest_sample_secret_key
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staynest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
